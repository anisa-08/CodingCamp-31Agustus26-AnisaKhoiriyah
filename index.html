<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="light">

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header__left">
      <span id="greeting-text" class="greeting-text">Selamat Pagi</span>
      <span id="user-name" class="user-name">Pengguna</span>
      <span class="separator">·</span>
      <span id="current-date" class="current-date"></span>
    </div>
    <div class="header__right">
      <!-- Custom Name -->
      <button id="btn-edit-name" class="btn-icon" title="Ubah Nama" aria-label="Ubah nama pengguna">✏️</button>
      <!-- Dark Mode Toggle -->
      <button id="btn-toggle-theme" class="btn-icon" title="Ganti Tema" aria-label="Ganti tema gelap/terang">🌙</button>
    </div>
  </header>

  <!-- ===== MODAL: EDIT NAME ===== -->
  <div id="modal-name" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-name-title">
    <div class="modal__box">
      <h2 id="modal-name-title">Ubah Nama</h2>
      <input
        id="input-name"
        type="text"
        class="input"
        placeholder="Masukkan nama kamu..."
        maxlength="30"
        autocomplete="off"
      />
      <div class="modal__actions">
        <button id="btn-save-name" class="btn btn--primary">Simpan</button>
        <button id="btn-cancel-name" class="btn btn--ghost">Batal</button>
      </div>
    </div>
  </div>

  <!-- ===== MAIN LAYOUT ===== -->
  <main class="dashboard">

    <!-- ===== COLUMN LEFT ===== -->
    <section class="col col--left">

      <!-- FOCUS TIMER -->
      <div class="card" id="card-timer">
        <div class="card__header">
          <h2 class="card__title">⏱ Focus Timer</h2>
        </div>
        <div class="timer-display" aria-live="polite" aria-label="Sisa waktu timer">
          <span id="timer-minutes">25</span>:<span id="timer-seconds">00</span>
        </div>
        <p id="timer-label" class="timer-label">Sesi Fokus</p>
        <div class="timer-controls">
          <button id="btn-timer-start" class="btn btn--primary">▶ Mulai</button>
          <button id="btn-timer-pause" class="btn btn--secondary" disabled>⏸ Jeda</button>
          <button id="btn-timer-reset" class="btn btn--ghost">↺ Reset</button>
        </div>
        <div class="timer-progress-bar" aria-hidden="true">
          <div id="timer-progress-fill" class="timer-progress-fill"></div>
        </div>
      </div>

      <!-- QUICK LINKS -->
      <div class="card" id="card-links">
        <div class="card__header">
          <h2 class="card__title">🔗 Quick Links</h2>
          <button id="btn-add-link" class="btn btn--sm btn--primary">+ Tambah</button>
        </div>

        <!-- Add Link Form -->
        <form id="form-link" class="add-form hidden" novalidate>
          <input
            id="input-link-label"
            type="text"
            class="input"
            placeholder="Nama link (mis. GitHub)"
            maxlength="30"
            autocomplete="off"
          />
          <input
            id="input-link-url"
            type="url"
            class="input"
            placeholder="URL (mis. https://github.com)"
            autocomplete="off"
          />
          <p id="link-error" class="error-msg hidden" role="alert"></p>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary btn--sm">Simpan</button>
            <button type="button" id="btn-cancel-link" class="btn btn--ghost btn--sm">Batal</button>
          </div>
        </form>

        <ul id="links-list" class="links-list" aria-label="Daftar quick links"></ul>
        <p id="links-empty" class="empty-msg">Belum ada link. Tambahkan sekarang!</p>
      </div>

    </section>

    <!-- ===== COLUMN RIGHT ===== -->
    <section class="col col--right">

      <!-- TO-DO LIST -->
      <div class="card" id="card-todo">
        <div class="card__header">
          <h2 class="card__title">✅ To-Do List</h2>
          <span id="todo-counter" class="badge">0 / 0</span>
        </div>

        <!-- Add Task Form -->
        <form id="form-todo" class="add-form" novalidate>
          <div class="input-row">
            <input
              id="input-todo"
              type="text"
              class="input"
              placeholder="Tambah tugas baru..."
              maxlength="100"
              autocomplete="off"
              aria-label="Input tugas baru"
            />
            <button type="submit" class="btn btn--primary">+ Tambah</button>
          </div>
          <p id="todo-error" class="error-msg hidden" role="alert"></p>
        </form>

        <!-- Filter -->
        <div class="filter-bar" role="group" aria-label="Filter tugas">
          <button class="filter-btn active" data-filter="all">Semua</button>
          <button class="filter-btn" data-filter="active">Aktif</button>
          <button class="filter-btn" data-filter="done">Selesai</button>
        </div>

        <!-- Task List -->
        <ul id="todo-list" class="todo-list" aria-label="Daftar tugas"></ul>
        <p id="todo-empty" class="empty-msg hidden">Tidak ada tugas di sini.</p>

        <!-- Bulk Actions -->
        <div class="todo-footer">
          <button id="btn-clear-done" class="btn btn--ghost btn--sm">🗑 Hapus Selesai</button>
          <button id="btn-mark-all" class="btn btn--ghost btn--sm">✔ Tandai Semua</button>
        </div>
      </div>

    </section>
  </main>

  <!-- ===== TOAST NOTIFICATION ===== -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="js/script.js"></script>
</body>
</html>
